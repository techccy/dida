# 前端 → GitHub Pages（DESIGN.md §17.1）
# pnpm build（web）→ apps/web/dist（含 404.html SPA 回退）→ GitHub Pages
# 前端同源调用 API：Cloudflare Workers Routes 把 dida.techccy.com 的
# /admin/* 与 /ws 路由到 Worker，无需构建时注入 VITE_API_URL/VITE_WS_URL
# （*.workers.dev 在中国大陆被阻断，勿再使用；api.ts 保留 VITE_ 覆盖能力）。
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build web
        working-directory: apps/web
        env:
          VITE_BASE: /
        run: pnpm build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
